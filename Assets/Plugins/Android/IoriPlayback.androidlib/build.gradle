// IORI のバックグラウンド再生サービス(Unity が裏に回っても予定表どおりに鳴らし続ける)。
// Unity の Gradle ビルドにライブラリモジュールとしてそのまま取り込まれる。
apply plugin: 'com.android.library'

// compileSdk と Build-Tools は Unity が作る unityLibrary に合わせる。
// 固定すると、Unity 同梱 SDK に無い版(例: Build-Tools 35)を Gradle が取りに行って失敗する。
evaluationDependsOn(':unityLibrary')
def unityAndroid = project(':unityLibrary').android

android {
    namespace 'com.iori.playback'
    compileSdk unityAndroid.compileSdk
    buildToolsVersion unityAndroid.buildToolsVersion

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.core:core:1.13.1'
}
